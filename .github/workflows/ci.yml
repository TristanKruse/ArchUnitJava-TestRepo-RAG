name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 25 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out the fixture
        uses: actions/checkout@v7
        with:
          path: ArchUnitJava-TestRepo-RAG

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve the public release and verify the external consumer
        shell: bash
        working-directory: ArchUnitJava-TestRepo-RAG
        run: ./mvnw --batch-mode --no-transfer-progress verify
