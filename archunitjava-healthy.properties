schema=archunitjava.cli.v1
inputs=target/classes
rules=domain-isolation,application-isolation
emptySelection=fail
allowIncompleteAnalysis=false
resultFormat=json
graphFormat=mermaid
graphDomain=types
rule.domain-isolation.domain=types
rule.domain-isolation.mode=no
rule.domain-isolation.origins=glob:dev.archunitjava.example.rag.domain.**
rule.domain-isolation.targets=glob:dev.archunitjava.example.rag.infrastructure.**
rule.domain-isolation.self=ignore
rule.domain-isolation.external=ignore
rule.domain-isolation.displayName=Domain stays independent of infrastructure
rule.domain-isolation.rationale=Domain contracts must remain portable and testable
rule.domain-isolation.tags=domain,rag
rule.domain-isolation.severity=error
rule.application-isolation.domain=types
rule.application-isolation.mode=no
rule.application-isolation.origins=glob:dev.archunitjava.example.rag.application.**
rule.application-isolation.targets=glob:dev.archunitjava.example.rag.infrastructure.**
rule.application-isolation.self=ignore
rule.application-isolation.external=ignore
rule.application-isolation.displayName=Application uses domain ports instead of adapters
rule.application-isolation.rationale=Infrastructure choices must remain replaceable
rule.application-isolation.tags=application,rag
rule.application-isolation.severity=error

